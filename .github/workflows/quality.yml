name: Site quality
on:
  push:
    branches: [redesign, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx eslint src
      - run: node --test scripts/check-story.mjs scripts/check-editing.mjs scripts/check-menu-publishing.mjs scripts/check-cms-publishing.mjs scripts/check-image-publication.mjs
      # Live SEO checks run separately after deployment, not against a stale alias.
      # No CMS credentials or customer data are needed by this workflow.
